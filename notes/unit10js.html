<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <style>
        h2 {border: 1px solid rgb(233, 81, 81);}
    </style>
    <script>
        function firstFunction () {
            alert('Hello World');
        }
        function clicky () {
            alert('Thanks for clicking!');
        }
        function hovery () {
            alert('Thanks for rollig over me!');
        }
    </script>
</head>
<body onload="firstFunction();">
    <h1>JavaScript Basics</h1>
    <p onclick="clicky();">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
    <h2 onmouseover="hovery();">Hover Text</h2>
</body>
</html>
