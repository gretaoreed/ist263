<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Intro</title>
    <style>
        div {border: 1px solid rgb(123, 165, 228);}
        section {display: flex;}
        section div {flex: 1;} 
    </style>
</head>
<body>
   
<section>
    <div>1</div>
</section>
<section>
    <div style="flex-basis: 25%;">2</div>
    <div style="flex-basis: 75%;">3</div>
</section>
<section>
    <div>4</div>
    <div>5</div>
</section>

</body>
</html>
